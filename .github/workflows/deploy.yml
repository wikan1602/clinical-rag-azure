name: Build, Evaluate, Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  ACR_NAME: acrclinicalragzgyaq2umgqzpg
  RESOURCE_GROUP: rg-clinical-rag

permissions:
  id-token: write
  contents: read

jobs:
  build-evaluate-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f Dockerfile.api -t clinical-rag-api:${{ github.sha }} .

      - name: Build UI image
        run: docker build -f Dockerfile.ui -t clinical-rag-ui:${{ github.sha }} .

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - run: pip install -r requirements.txt

      - name: Debug DNS resolution via public resolvers (temporary)
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
        run: |
          HOST=$(python -c "import os; from urllib.parse import urlparse; print(urlparse(os.environ['AZURE_OPENAI_ENDPOINT']).hostname)")
          echo "Resolving host: $HOST"
          echo "--- default resolver (runner's own, e.g. systemd-resolved) ---"
          python -c "import socket; print(socket.getaddrinfo('$HOST', 443))" || echo "default resolver FAILED"
          echo "--- Google public DoH (independent of runner's local resolver) ---"
          curl -s "https://dns.google/resolve?name=$HOST&type=A" || echo "Google DoH query failed"
          echo ""
          echo "--- Cloudflare public DoH (second independent resolver) ---"
          curl -s "https://cloudflare-dns.com/dns-query?name=$HOST&type=A" -H "accept: application/dns-json" || echo "Cloudflare DoH query failed"
          echo ""

      - name: Start candidate API for evaluation (no Docker)
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_CHAT_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_CHAT_DEPLOYMENT }}
          AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}
          AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}
          AZURE_SEARCH_API_KEY: ${{ secrets.AZURE_SEARCH_API_KEY }}
          AZURE_SEARCH_INDEX_FIXED: ${{ secrets.AZURE_SEARCH_INDEX_FIXED }}
          AZURE_SEARCH_INDEX_SEMANTIC: ${{ secrets.AZURE_SEARCH_INDEX_SEMANTIC }}
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > candidate-api.log 2>&1 &
          echo $! > candidate-api.pid

      - name: Wait for candidate API to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          cat candidate-api.log
          exit 1

      - name: Run eval suite against candidate build
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_CHAT_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_CHAT_DEPLOYMENT }}
          AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}
          AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}
          AZURE_SEARCH_API_KEY: ${{ secrets.AZURE_SEARCH_API_KEY }}
          AZURE_SEARCH_INDEX_FIXED: ${{ secrets.AZURE_SEARCH_INDEX_FIXED }}
          AZURE_SEARCH_INDEX_SEMANTIC: ${{ secrets.AZURE_SEARCH_INDEX_SEMANTIC }}
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
        run: python -m eval.run_eval

      - name: Gate deployment on eval scores
        run: python .github/scripts/check_eval_gate.py

      - name: Dump candidate API logs
        if: always()
        run: cat candidate-api.log || true

      - name: Stop candidate API process
        if: always()
        run: |
          if [ -f candidate-api.pid ]; then
            kill "$(cat candidate-api.pid)" || true
          fi

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Push images to Azure Container Registry
        run: |
          az acr login --name $ACR_NAME
          docker tag clinical-rag-api:${{ github.sha }} $ACR_NAME.azurecr.io/clinical-rag-api:${{ github.sha }}
          docker tag clinical-rag-api:${{ github.sha }} $ACR_NAME.azurecr.io/clinical-rag-api:latest
          docker tag clinical-rag-ui:${{ github.sha }} $ACR_NAME.azurecr.io/clinical-rag-ui:${{ github.sha }}
          docker tag clinical-rag-ui:${{ github.sha }} $ACR_NAME.azurecr.io/clinical-rag-ui:latest
          docker push $ACR_NAME.azurecr.io/clinical-rag-api:${{ github.sha }}
          docker push $ACR_NAME.azurecr.io/clinical-rag-api:latest
          docker push $ACR_NAME.azurecr.io/clinical-rag-ui:${{ github.sha }}
          docker push $ACR_NAME.azurecr.io/clinical-rag-ui:latest

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update -g $RESOURCE_GROUP -n ca-clinical-rag-api \
            --image $ACR_NAME.azurecr.io/clinical-rag-api:${{ github.sha }}
          az containerapp update -g $RESOURCE_GROUP -n ca-clinical-rag-ui \
            --image $ACR_NAME.azurecr.io/clinical-rag-ui:${{ github.sha }}
